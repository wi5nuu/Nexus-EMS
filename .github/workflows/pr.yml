name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nexus_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: |
          npm run type-check -w apps/backend
          npm run type-check -w apps/web

      - name: ESLint & Prettier
        run: npm run lint

      - name: Run Prisma Generate
        run: npm run prisma:generate -w apps/backend

      - name: Apply Test DB Migrations
        env:
          DATABASE_URL: "postgresql://root:rootpassword@localhost:5432/nexus_test_db"
        run: npm run prisma:migrate -w apps/backend -- --name init_test

      - name: Unit & Integration Tests (Vitest)
        env:
          DATABASE_URL: "postgresql://root:rootpassword@localhost:5432/nexus_test_db"
          REDIS_URL: "redis://localhost:6379"
        run: npm run test -w apps/backend -- --coverage

      - name: Build Next.js
        run: npm run build -w apps/web

      - name: SAST Scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

      - name: License Compliance Check
        run: npx license-checker --summary
