services:
  - type: web
    name: nexus-ems-backend
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - fromDatabase:
          name: nexus-db
          property: connectionString
    rootDirectory: apps/backend

database:
  name: nexus-db
  plan: free
